name: tokyo3_veilgate

services:
  veilgate-init:
    image: alpine:3.21
    command: ["sh", "-c", "chown -R 1000:1000 /var/lib/veilgate && chmod 700 /var/lib/veilgate"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      # The data directory is mode 0700 and owned by UID 1000; recursive
      # ownership repair needs traversal without broad DAC override.
      - DAC_READ_SEARCH
    volumes:
      - type: volume
        source: db_data
        target: /var/lib/veilgate

  veilgated:
    image: ${VEILGATE_IMAGE:-tokyo3-veilgate:dev}
    command: ["serve"]
    user: ${VEILGATE_UID:-1000}:${VEILGATE_GID:-1000}
    restart: unless-stopped
    depends_on:
      veilgate-init:
        condition: service_completed_successfully
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      VEILGATED_CLIENTS_FILE: /etc/veilgate/clients.json
      VEILGATED_SECRETS_FILE: /etc/veilgate/secrets.json
      VEILGATED_OAUTH_FILE: /etc/veilgate/oauth.json
      VEILGATED_AUTH_FILE: /var/lib/veilgate/auth.json
      VEILGATED_DEV_API_KEY: ${VEILGATED_DEV_API_KEY:-veilgate-development-secret}
      # VEILGATED_DATABASE_URL: sqlite:/var/lib/veilgate/flows.db
      # Bind each listener to the interface-specific Docker network alias.
      # The proxy is reachable on tokyo3_hq_sandbox only; the console is
      # reachable on tokyo3_hq_default only.
      VEILGATED_ADDR: veilgated-proxy:${VEILGATED_PROXY_PORT:-8080}
      VEILGATED_CONSOLE_ADDR: veilgated-console:${VEILGATED_CONSOLE_PORT:-8081}
      VEILGATED_FLOW_RETENTION: ${VEILGATED_FLOW_RETENTION:-1000}
      VEILGATED_DIAL_TIMEOUT: ${VEILGATED_DIAL_TIMEOUT:-10s}
      VEILGATED_SESSION_IDLE_TIMEOUT: ${VEILGATED_SESSION_IDLE_TIMEOUT:-5m}
      VEILGATED_SESSION_MAX_DURATION: ${VEILGATED_SESSION_MAX_DURATION:-30m}
      VEILGATED_UPSTREAM_RESPONSE_HEADER_TIMEOUT: ${VEILGATED_UPSTREAM_RESPONSE_HEADER_TIMEOUT:-30s}
      VEILGATED_CAPTURE_LIMIT_BYTES: ${VEILGATED_CAPTURE_LIMIT_BYTES:-262144}
      VEILGATED_MEDIATION_LIMIT_BYTES: ${VEILGATED_MEDIATION_LIMIT_BYTES:-67108864}
      VEILGATED_INTERCEPT_CA_CERT: ${VEILGATED_INTERCEPT_CA_CERT:-/etc/veilgate/intercept-ca.crt}
      VEILGATED_INTERCEPT_CA_KEY: ${VEILGATED_INTERCEPT_CA_KEY:-/etc/veilgate/intercept-ca.key}
      VEILGATED_PROXY_CERT: ${VEILGATED_PROXY_CERT:-/etc/veilgate/proxy.crt}
      VEILGATED_PROXY_KEY: ${VEILGATED_PROXY_KEY:-/etc/veilgate/proxy.key}
      VEILGATED_CONSOLE_CERT: ${VEILGATED_CONSOLE_CERT:-/etc/veilgate/console.crt}
      VEILGATED_CONSOLE_KEY: ${VEILGATED_CONSOLE_KEY:-/etc/veilgate/console.key}
      VEILGATED_CONSOLE_USERNAME: ${VEILGATED_CONSOLE_USERNAME:-admin}
      VEILGATED_CONSOLE_PASSWORD: ${VEILGATED_CONSOLE_PASSWORD:-admin}
    volumes:
      - db_data:/var/lib/veilgate
      - type: volume
        source: tokyo3_hq_proj
        target: /etc/veilgate
        read_only: true
        volume:
          subpath: abagile/veilgate/config
    ports:
      - 127.0.0.1:${VEILGATED_CONSOLE_PORT:-8081}:${VEILGATED_CONSOLE_PORT:-8081}
    # Keep management first so Docker's host-published port targets the
    # management-network endpoint. Each daemon listener still binds its own
    # network-specific alias below.
    networks:
      management:
        priority: 100
        aliases:
          - veilgated
          - veilgated-console
      sandbox:
        priority: 10
        aliases:
          - veilgated
          - veilgated-proxy

networks:
  sandbox:
    external: true
    name: tokyo3_hq_sandbox
  management:
    external: true
    name: tokyo3_hq_default

volumes:
  tokyo3_hq_proj:
    external: true
  db_data:
