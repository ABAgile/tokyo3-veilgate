name: ${COMPOSE_PROJECT_NAME:-tokyo3_veilgate}

services:
  veilgated:
    build:
      context: .
      target: server
      args:
        VERSION: ${VERSION:-dev-docker}
    command: ["serve"]
    user: ${VEILGATE_UID:-1000}:${VEILGATE_GID:-1000}
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # These paths are the daemon defaults; set them only when using
      # non-standard mount locations.
      # VEILGATED_CLIENTS_FILE: /etc/veilgate/clients.json
      # VEILGATED_SECRETS_FILE: /etc/veilgate/secrets.json
      # VEILGATED_OAUTH_FILE: /etc/veilgate/oauth.json
      # VEILGATED_AUTH_FILE: /var/lib/veilgate/auth.json
      # VEILGATED_DATABASE_URL: sqlite:/var/lib/veilgate/flows.db
      # VEILGATED_FLOW_RETENTION: 1000
      # VEILGATED_DIAL_TIMEOUT: 10s
      # VEILGATED_SESSION_IDLE_TIMEOUT: 10m
      # VEILGATED_SESSION_MAX_DURATION: 2h
      # VEILGATED_UPSTREAM_RESPONSE_HEADER_TIMEOUT: 60s
      # VEILGATED_CAPTURE_LIMIT_BYTES: 1048576
      VEILGATED_MEDIATION_LIMIT_BYTES: 8388608
      # VEILGATED_RECORD_QUEUE_CAPACITY: 256
      # VEILGATED_RECORD_WORKERS: 4
      # These certificate paths are also daemon defaults; set them only when
      # the mounted filenames differ.
      # VEILGATED_INTERCEPT_CA_CERT: /etc/veilgate/intercept-ca.crt
      # VEILGATED_INTERCEPT_CA_KEY: /etc/veilgate/intercept-ca.key
      # VEILGATED_PROXY_CERT: /etc/veilgate/proxy.crt
      # VEILGATED_PROXY_KEY: /etc/veilgate/proxy.key
      # VEILGATED_CONSOLE_CERT: /etc/veilgate/console.crt
      # VEILGATED_CONSOLE_KEY: /etc/veilgate/console.key
      #
      # Bind each listener to the interface-specific Docker network alias.
      # The proxy is reachable on tokyo3_hq_sandbox only; the console is
      # reachable on tokyo3_hq_default only.
      VEILGATED_ADDR: veilgated-proxy:${VEILGATED_PROXY_PORT:-8080}
      VEILGATED_CONSOLE_ADDR: veilgated-console:${VEILGATED_CONSOLE_PORT:-8081}
      # The console binds to the management network, so credentials are
      # required. Provide both values in the deployment environment.
      VEILGATED_CONSOLE_USERNAME: ${VEILGATED_CONSOLE_USERNAME:-admin}
      VEILGATED_CONSOLE_PASSWORD: ${VEILGATED_CONSOLE_PASSWORD:-admin}
    volumes:
      # Initialize this volume manually as VEILGATE_UID:VEILGATE_GID before the first start
      - data:/var/lib/veilgate
      - type: volume
        source: config
        target: /etc/veilgate
        read_only: true
        volume:
          subpath: ${VEILGATE_CONFIG_SUBPATH:-abagile/veilgate/config}
    ports:
      - 127.0.0.1:${VEILGATED_CONSOLE_PORT:-8081}:${VEILGATED_CONSOLE_PORT:-8081}
    networks:
      management:
        priority: 100
        aliases:
          - veilgated
          - veilgated-console
      sandbox:
        priority: 10
        aliases:
          - veilgated
          - veilgated-proxy

networks:
  sandbox:
    external: true
    name: ${VEILGATE_SANDBOX_NETWORK:-tokyo3_hq_sandbox}
  management:
    external: true
    name: ${VEILGATE_MANAGEMENT_NETWORK:-tokyo3_hq_default}

volumes:
  config:
    external: true
    name: ${VEILGATE_CONFIG_VOLUME:-tokyo3_hq_proj}
  data:
