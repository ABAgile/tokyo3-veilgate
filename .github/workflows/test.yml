name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@v5
        id: cache-go-tools
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('go.mod', '.github/workflows/test.yml') }}-${{ steps.setup-go.outputs.go-version }}

      - if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/tools/gopls@v0.23.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install golang.org/x/tools/cmd/deadcode@v0.51.0

      - run: node --check internal/console/static/app.js
      - run: node --check internal/console/static/formatters.js
      - run: node --test internal/console/formatters_test.mjs
      - run: go vet ./...
      - run: staticcheck ./...
      - run: find . -type f -name "*.go" -print0 | xargs -0 -n 100 gopls check -severity=hint
      - run: go test ./... -count=1
      - run: govulncheck ./...
      - name: deadcode
        run: |
          out=$(deadcode -test ./...)
          if [ -n "$out" ]; then echo "$out"; echo "deadcode: unreachable functions found (above)"; exit 1; fi
